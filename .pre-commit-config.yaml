# ============================================================
# pre-commit 钩子配置 · 开源/比赛提交专用
#
# 由 oss-leak-review 技能的 install-hooks.sh 自动安装到目标仓库根目录。
# 安装后的目录布局:
#   <repo>/.pre-commit-config.yaml
#   <repo>/.leak-guard/allowlist-guard.sh
#   <repo>/.leak-guard/pii-scan.sh
#   <repo>/.leak-guard/gitleaks.toml
#
# 手动安装见 SKILL.md「安装钩子」一节。
# ============================================================

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
fail_fast: false

repos:
  # ---------- 基础卫生 ----------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key          # 私钥文件/内容
      - id: check-added-large-files     # 大文件
        args: ['--maxkb=5120']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: forbid-submodules           # 子模块绕过扫描,比赛场景直接禁
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-json
      - id: check-yaml
        args: ['--allow-multiple-documents']
      - id: check-toml

  # ---------- 密钥扫描(正则,快) ----------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        args: ['--config', '.leak-guard/gitleaks.toml', '--redact', '-v']

  # ---------- 密钥扫描(可在线验证,准) ----------
  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.82.13
    hooks:
      - id: trufflehog
        name: trufflehog (verified only)
        entry: trufflehog git file://. --since-commit HEAD --only-verified --fail --no-update
        language: system
        stages: [pre-push]              # 推送前才跑全历史,避免每次 commit 太慢

  # ---------- 审计型 baseline(Yelp) ----------
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: '(?i)(package-lock\.json|yarn\.lock|pnpm-lock\.yaml|poetry\.lock)$'

  # ---------- Notebook 输出清空 ----------
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
        args: ['--extra-keys', 'metadata.kernelspec metadata.language_info.version cell.metadata.executionInfo']

  # ---------- 路径白名单守卫(本技能自带)----------
  - repo: local
    hooks:
      - id: allowlist-guard
        name: 白名单守卫 · 禁止非项目文件进入仓库
        entry: bash .leak-guard/allowlist-guard.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: pii-scan
        name: 中文 PII 扫描 · 手机号/身份证/学号
        entry: bash .leak-guard/pii-scan.sh
        language: system
        pass_filenames: false
        always_run: true
